<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a233d" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Gold Balance Scale Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Scanning Beam Animation -->
    <linearGradient id="scan-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <style>
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) opacity(0.4); }
        50% { transform: translateY(-12px) opacity(0.9); }
      }
      .scale-icon {
        transform-origin: 150px 160px;
        animation: pulseScale 4s ease-in-out infinite;
      }
      .scan-beam {
        animation: scan 6s linear infinite;
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Tech Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240" />
    <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="160" r="140" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />
  <circle cx="1050" cy="100" r="120" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Particles -->
  <circle class="particle-1" cx="220" cy="80" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="980" cy="240" r="4" fill="#fbbf24" />
  <circle class="particle-3" cx="1100" cy="70" r="2.5" fill="#818cf8" />
  <circle class="particle-1" cx="500" cy="270" r="3" fill="#38bdf8" />

  <!-- Scale of Justice Vector Icon -->
  <g class="scale-icon" filter="url(#subtle-glow)">
    <!-- Main Pillar -->
    <rect x="146" y="80" width="8" height="150" rx="4" fill="url(#gold-grad)" />
    <!-- Pillar Base -->
    <path d="M 120,230 L 180,230 Q 180,220 170,220 L 130,220 Q 120,220 120,230 Z" fill="url(#gold-grad)" />
    <!-- Top Beam -->
    <path d="M 70,110 L 230,110" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="150" cy="110" r="8" fill="#fbbf24" />
    
    <!-- Left Scale -->
    <line x1="70" y1="110" x2="40" y2="160" stroke="#f59e0b" stroke-width="2" />
    <line x1="70" y1="110" x2="100" y2="160" stroke="#f59e0b" stroke-width="2" />
    <path d="M 30,160 Q 70,185 110,160 Z" fill="url(#gold-grad)" opacity="0.9" />

    <!-- Right Scale -->
    <line x1="230" y1="110" x2="200" y2="160" stroke="#f59e0b" stroke-width="2" />
    <line x1="230" y1="110" x2="260" y2="160" stroke="#f59e0b" stroke-width="2" />
    <path d="M 190,160 Q 230,185 270,160 Z" fill="url(#gold-grad)" opacity="0.9" />
  </g>

  <!-- Main Title & Typography -->
  <g transform="translate(320, 0)">
    <!-- Subtitle / Tag -->
    <rect x="0" y="55" width="310" height="28" rx="14" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5" />
    <text x="15" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      ⚡ OPEN-SOURCE LEGAL TECH &amp; SAAS
    </text>

    <!-- Main Heading -->
    <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtle-glow)">
      Awesome Litigation Management
    </text>

    <!-- Description Lines -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      The Curated Index of Open-Source Case Management, Legal AI &amp; Practice Platforms
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="16" cy="16" r="4" fill="#10b981" />
      <text x="28" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Case Management</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="191" cy="16" r="4" fill="#6366f1" />
      <text x="203" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Legal AI &amp; RAG</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="336" cy="16" r="4" fill="#f59e0b" />
      <text x="348" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">E-Discovery &amp; EDMS</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <circle cx="501" cy="16" r="4" fill="#ec4899" />
      <text x="513" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Billing &amp; Analytics</text>
    </g>
  </g>

  <!-- Top Accent Bar with Dynamic Glow -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Scanning Beam Effect -->
  <g class="scan-beam">
    <rect x="0" y="0" width="300" height="320" fill="url(#scan-line)" />
  </g>
</svg>
